name: Generate contribution snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake/github-snake.svg?color_snake=%2306b6d4&color_dots=%23e2e8f0,%23a5f3fc,%2367e8f9,%2322d3ee,%230891b2
            assets/snake/github-snake-dark.svg?palette=github-dark&color_snake=%23f0abfc&color_dots=%230f172a,%231e1b4b,%23312e81,%237c3aed,%23c026d3

      - name: Commit refreshed animations
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake/github-snake.svg assets/snake/github-snake-dark.svg

          if git diff --cached --quiet; then
            echo "Snake animation is already up to date."
            exit 0
          fi

          git commit -m "chore: refresh contribution snake"
          git push
