<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title description">
  <title id="title">Terminal animada de SX110903</title>
  <desc id="description">Una terminal muestra especialidades, ubicación, aprendizaje y objetivo profesional.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a32"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.5" stop-color="#312e81"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .cursor { animation: blink 1s steps(2, end) infinite; }
      .scan { animation: scan 5s linear infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes scan {
        from { transform: translateX(-900px); }
        to { transform: translateX(900px); }
      }
    </style>
  </defs>

  <rect x="2" y="2" width="896" height="296" rx="18" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
  <path d="M20 2 H880 Q898 2 898 20 V52 H2 V20 Q2 2 20 2" fill="url(#bar)"/>
  <circle cx="28" cy="27" r="7" fill="#fb7185"/>
  <circle cx="52" cy="27" r="7" fill="#fbbf24"/>
  <circle cx="76" cy="27" r="7" fill="#34d399"/>
  <text x="450" y="33" text-anchor="middle" fill="#cbd5e1" font-size="14">sx110903@github: ~/profile</text>

  <g font-size="17">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur=".2s" begin=".3s" fill="freeze"/>
      <text x="30" y="88" fill="#34d399">➜</text>
      <text x="58" y="88" fill="#60a5fa">whoami</text>
      <text x="168" y="88" fill="#e2e8f0">Systems &amp; Network Engineer</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur=".2s" begin="1.1s" fill="freeze"/>
      <text x="30" y="126" fill="#34d399">➜</text>
      <text x="58" y="126" fill="#60a5fa">focus</text>
      <text x="168" y="126" fill="#e2e8f0">DevOps · IaC · Containers · Networking</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur=".2s" begin="1.9s" fill="freeze"/>
      <text x="30" y="164" fill="#34d399">➜</text>
      <text x="58" y="164" fill="#60a5fa">location</text>
      <text x="168" y="164" fill="#e2e8f0">Barcelona, Spain</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur=".2s" begin="2.7s" fill="freeze"/>
      <text x="30" y="202" fill="#34d399">➜</text>
      <text x="58" y="202" fill="#60a5fa">learning</text>
      <text x="168" y="202" fill="#e2e8f0">AWS · Kubernetes · CCNA</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur=".2s" begin="3.5s" fill="freeze"/>
      <text x="30" y="240" fill="#34d399">➜</text>
      <text x="58" y="240" fill="#60a5fa">mission</text>
      <text x="168" y="240" fill="#f0abfc">Automate today what would be manual tomorrow.</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur=".2s" begin="4.2s" fill="freeze"/>
      <text x="30" y="273" fill="#34d399">➜</text>
      <rect x="58" y="257" width="10" height="20" rx="1" fill="#67e8f9" filter="url(#glow)" class="cursor"/>
    </g>
  </g>

  <rect x="-900" y="52" width="110" height="244" fill="#22d3ee" opacity="0.025" class="scan"/>
</svg>
