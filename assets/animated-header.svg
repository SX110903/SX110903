<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title description">
  <title id="title">SX110903 — Systems, Network and DevOps Engineer</title>
  <desc id="description">Animated technology banner with a network grid, moving packets and a scanning beam.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0d1630"/>
      <stop offset="1" stop-color="#07101f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#7c3aed;#00e5ff" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#22d3ee;#7c3aed" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#00e5ff;#ec4899" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <path id="packetPathA" d="M80 80 C230 10 310 145 465 72 S760 18 920 88"/>
    <path id="packetPathB" d="M65 280 C250 220 340 342 510 270 S760 216 940 286"/>
    <style>
      .network-line {
        stroke-dasharray: 8 11;
        animation: dash 9s linear infinite;
      }
      .node {
        animation: pulse 2.4s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .node:nth-of-type(2n) { animation-delay: -1.2s; }
      .float-a { animation: floatA 7s ease-in-out infinite; }
      .float-b { animation: floatB 9s ease-in-out infinite; }
      .status { animation: status 1.6s ease-in-out infinite; }
      .cursor { animation: blink 1s steps(2, end) infinite; }
      @keyframes dash { to { stroke-dashoffset: -190; } }
      @keyframes pulse {
        0%, 100% { opacity: .45; transform: scale(.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes floatA {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(12px, -10px); }
      }
      @keyframes floatB {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-10px, 12px); }
      }
      @keyframes status {
        0%, 100% { opacity: .35; }
        50% { opacity: 1; }
      }
      @keyframes blink { 50% { opacity: 0; } }
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1000" height="360" rx="24" fill="url(#background)"/>
  <circle cx="120" cy="40" r="180" fill="url(#orb)" filter="url(#softGlow)" class="float-a"/>
  <circle cx="900" cy="325" r="210" fill="url(#orb)" filter="url(#softGlow)" class="float-b"/>
  <rect width="1000" height="360" rx="24" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" values="0 0;40 40" dur="12s" repeatCount="indefinite"/>
  </rect>

  <g fill="none" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1.5">
    <use href="#packetPathA" class="network-line"/>
    <use href="#packetPathB" class="network-line"/>
    <path d="M102 78 L190 158 L76 276 M190 158 L342 105 L447 216 M447 216 L574 118 L706 186 M706 186 L855 94 L926 282" class="network-line"/>
  </g>

  <g fill="#22d3ee" filter="url(#glow)">
    <circle r="5">
      <animateMotion dur="5.5s" repeatCount="indefinite" rotate="auto">
        <mpath href="#packetPathA"/>
      </animateMotion>
    </circle>
    <circle r="4" fill="#ec4899">
      <animateMotion dur="7s" begin="-2.5s" repeatCount="indefinite" rotate="auto">
        <mpath href="#packetPathB"/>
      </animateMotion>
    </circle>
  </g>

  <g fill="#a5f3fc" filter="url(#glow)">
    <circle class="node" cx="102" cy="78" r="4"/>
    <circle class="node" cx="190" cy="158" r="4"/>
    <circle class="node" cx="76" cy="276" r="4"/>
    <circle class="node" cx="342" cy="105" r="4"/>
    <circle class="node" cx="447" cy="216" r="4"/>
    <circle class="node" cx="574" cy="118" r="4"/>
    <circle class="node" cx="706" cy="186" r="4"/>
    <circle class="node" cx="855" cy="94" r="4"/>
    <circle class="node" cx="926" cy="282" r="4"/>
  </g>

  <rect x="0" y="-42" width="1000" height="60" fill="url(#scan)" opacity="0.7">
    <animate attributeName="y" values="-42;360" dur="4.8s" repeatCount="indefinite"/>
  </rect>

  <g text-anchor="middle">
    <text x="500" y="130" fill="#94a3b8" font-size="16" font-weight="600" letter-spacing="6">HELLO, WORLD — I AM</text>
    <text x="500" y="210" fill="url(#accent)" font-size="76" font-weight="900" letter-spacing="2" filter="url(#glow)">SX110903</text>
    <text x="500" y="252" fill="#e2e8f0" font-size="21" font-weight="500" letter-spacing="1.2">Systems &amp; Network Engineer  ·  DevOps  ·  Telematics</text>
  </g>

  <g transform="translate(385 292)">
    <rect width="230" height="38" rx="19" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.45"/>
    <circle cx="22" cy="19" r="6" fill="#34d399" filter="url(#glow)" class="status"/>
    <text x="40" y="25" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">systems operational</text>
    <rect x="203" y="11" width="2" height="16" rx="1" fill="#67e8f9" class="cursor"/>
  </g>

  <rect x="1" y="1" width="998" height="358" rx="23" fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="2"/>
</svg>
